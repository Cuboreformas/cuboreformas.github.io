<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 1200 450">
  <title>CUBO Reformas — vector editable</title>
  <g fill="none" stroke="#09284A" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Isometric cube -->
    <path d="M70 145 L210 65 L350 145 L210 225 Z"/>
    <path d="M70 145 V325 L210 405 V225"/>
    <path d="M350 145 V325 L210 405"/>
    <!-- Integrated pointed opening, matching the approved reference -->
    <path d="M210 405 V260 L255 286 L350 340"/>
  </g>

  <!-- Wordmark -->
  <g fill="#09284A" font-family="Arial, Helvetica, sans-serif">
    <text x="415" y="230" font-size="130" font-weight="800" letter-spacing="1">CUBO</text>
    <text x="420" y="305" font-size="48" font-weight="400" letter-spacing="17">REFORMAS</text>
  </g>
</svg>